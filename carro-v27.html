<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Simulador V27 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lienzo 3D a pantalla completa sobre blanco; marca arriba, estado arriba a la derecha, panel de controles abajo. */
:root {
  --bg: #ffffff;
  --ink: #15171b;
  --muted: #6a7079;
  --line: #dfe2e7;
  --panel: rgba(255, 255, 255, 0.9);
  --accent: #d9622b;
  --display: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#c.grabbing { cursor: grabbing; }
#c.pick { cursor: pointer; }

.brand, .status, .dock, .hint { position: fixed; z-index: 2; }
.brand {
  top: max(16px, env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.brand .tag { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.brand h1 { margin: 6px 0 0; font: 800 clamp(26px, 5vw, 40px)/1 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.brand h1 span { color: var(--accent); }

.status {
  top: max(16px, env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  text-align: right;
  font: 400 11px/1.7 var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.status b { color: var(--ink); font-weight: 500; }

.hint {
  left: 50%;
  transform: translateX(-50%);
  top: max(76px, calc(env(safe-area-inset-top, 0px) + 70px));
  width: max-content;
  max-width: calc(100% - 32px);
  text-align: center;
  font: 400 12px/1.4 var(--mono);
  color: var(--muted);
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.hint.gone { opacity: 0; }

.dock {
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  margin-inline: auto;
  max-width: 980px;
  background: var(--panel);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 10px;
  max-height: 46vh;
  display: flex;
  flex-direction: column;
}
.dock-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 14px; }
.dock-bar span { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.dock-body { overflow-y: auto; padding: 4px 14px 14px; display: grid; gap: 14px 28px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.dock.min .dock-body { display: none; }
.grp { min-width: 0; }
.grp h2 { margin: 0 0 8px; font: 500 10.5px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  appearance: none;
  font: 600 13px/1 var(--display);
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 12px;
  min-height: 36px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.chip:hover { border-color: var(--ink); }
.chip:focus-visible, .sw:focus-visible, .min-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.solid { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: inline-block; }
.chip[aria-pressed="true"] i { background: #5ff0a0; }
.min-btn { font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; min-height: 30px; padding: 0 10px; cursor: pointer; }

.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

#fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; font: 400 14px/1.5 var(--mono); color: var(--muted); z-index: 5; background: var(--bg); }

@media (max-width: 560px) {
  .status { display: none; }
  .hint { font-size: 11px; }
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="SUV en 3D. Arrastra para girar."></canvas>

<header class="brand">
  <div class="tag">Santi GC · Simulador 3D · Aproximación</div>
  <h1>V27 <span>SUV</span></h1>
</header>

<div class="status" id="status" aria-live="polite"></div>
<div class="hint" id="hint">Arrastra para girar · rueda o pellizco para acercar · toca una puerta para abrirla</div>

<section class="dock" id="dock" aria-label="Controles del auto">
  <div class="dock-bar">
    <span>Controles</span>
    <button class="min-btn" id="minBtn" type="button" aria-expanded="true">Ocultar</button>
  </div>
  <div class="dock-body">
    <div class="grp"><h2>Abrir</h2><div class="row" id="gOpen"></div></div>
    <div class="grp"><h2>Vista</h2><div class="row" id="gView"></div></div>
    <div class="grp"><h2>Ajustes</h2><div class="row" id="gOpts"></div></div>
    <div class="grp"><h2>Color</h2><div class="row" id="gColor"></div></div>
  </div>
</section>

<div id="fallback">No se pudo cargar el motor 3D.<br>Revisa tu conexión y recarga la página.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  if (!window.THREE || !THREE.OrbitControls) { document.getElementById('fallback').style.display = 'grid'; return; }

  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('c');
  const PI = Math.PI;

  /* ---------- Renderer, cámara, escena ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xffffff, 1);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 120);

  /* Entorno de estudio para los reflejos de la pintura y el vidrio */
  (function buildEnv() {
    const es = new THREE.Scene();
    const sg = new THREE.SphereGeometry(30, 32, 24);
    const p = sg.attributes.position, cols = [];
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) / 30;
      const v = y > 0 ? 0.9 + 0.1 * y : 0.9 + y * 0.5;
      cols.push(v, v, v);
    }
    sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const panel = (w, h, x, y, z, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m);
    };
    panel(16, 7, 0, 15, 0, 4);
    panel(3, 12, -14, 3, 3, 3.2);
    panel(3, 12, 14, 3, -3, 3.2);
    panel(12, 2, 0, 2, -17, 2.4);
    panel(12, 2, 0, 2, 17, 2.4);
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(es, 0.03).texture;
    pm.dispose();
  })();

  scene.add(new THREE.HemisphereLight(0xffffff, 0xd9dde4, 0.28));
  const key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(4, 7, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  const sc = key.shadow.camera; sc.left = -3.8; sc.right = 3.8; sc.top = 3.8; sc.bottom = -3.8; sc.near = 1; sc.far = 24;
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.3);
  fill.position.set(-5, 3, -4);
  scene.add(fill);

  /* ---------- Materiales ---------- */
  const paint = new THREE.MeshPhysicalMaterial({ color: 0xbdb287, metalness: 0.35, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.04, side: THREE.DoubleSide });
  const trim = new THREE.MeshStandardMaterial({ color: 0x0d0e11, roughness: 0.55, metalness: 0.2, side: THREE.DoubleSide });
  const plastic = new THREE.MeshStandardMaterial({ color: 0x1b1d22, roughness: 0.7, metalness: 0.1, side: THREE.DoubleSide });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xe6e8ec, roughness: 0.12, metalness: 1 });
  const gun = new THREE.MeshStandardMaterial({ color: 0x3a3e46, roughness: 0.35, metalness: 0.9, side: THREE.DoubleSide });
  const rubber = new THREE.MeshStandardMaterial({ color: 0x101113, roughness: 0.9, metalness: 0 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x0b1820, roughness: 0.04, metalness: 0.85, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false });
  const fabric = new THREE.MeshStandardMaterial({ color: 0xdf7440, roughness: 0.55, side: THREE.DoubleSide });
  const leather = new THREE.MeshStandardMaterial({ color: 0xc45a2a, roughness: 0.6, side: THREE.DoubleSide });
  const carpet = new THREE.MeshStandardMaterial({ color: 0x1c1e22, roughness: 1, side: THREE.DoubleSide });
  const liner = new THREE.MeshStandardMaterial({ color: 0xb4501f, roughness: 1, side: THREE.DoubleSide });
  const glassDark = new THREE.MeshStandardMaterial({ color: 0x07090c, roughness: 0.05, metalness: 0.9 });
  const redPart = new THREE.MeshStandardMaterial({ color: 0xb3171f, roughness: 0.5, metalness: 0.3 });
  const headLens = new THREE.MeshStandardMaterial({ color: 0xf5f7fa, emissive: 0xfff2c8, emissiveIntensity: 0.15, roughness: 0.1, metalness: 0.2 });
  const tailLens = new THREE.MeshStandardMaterial({ color: 0xa5121a, emissive: 0xff1d25, emissiveIntensity: 0.25, roughness: 0.2 });
  const lineMat = new THREE.LineBasicMaterial({ color: 0x0d0e11 });

  [paint, trim, plastic, chrome, gun, rubber, glass, fabric, leather, carpet, liner, glassDark, redPart, headLens, tailLens].forEach(m => {
    m.color.convertSRGBToLinear(); if (m.emissive) m.emissive.convertSRGBToLinear();
  });

  /* ---------- Utilidades de geometría ---------- */
  function shadowed(m, cast = true) { m.castShadow = cast; m.receiveShadow = true; return m; }
  function box(w, h, d, mat, x, y, z, parent) {
    const m = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat));
    m.position.set(x, y, z); if (parent) parent.add(m); return m;
  }
  function poly(pts) {
    const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
    s.closePath(); return s;
  }
  function extrudeGeo(shape, depth, bevel) {
    const b = bevel || 0;
    const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 28 });
    g.translate(0, 0, -depth / 2); return g;
  }
  function extrude(shape, depth, mat, bevel) { return shadowed(new THREE.Mesh(extrudeGeo(shape, depth, bevel), mat)); }
  function cyl(r, h, mat, x, y, z, parent, seg) {
    const m = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 24), mat)); m.position.set(x, y, z); if (parent) parent.add(m); return m;
  }
  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  }

  /* ---------- Auto: SUV cuadrado tipo V27 ---------- */
  const BASE_Y = -0.95;
  const car = new THREE.Group();
  car.position.y = BASE_Y;
  scene.add(car);

  const items = {};       // puertas, capó y portón
  const pickables = [];
  function addItem(k, obj, axis, max, label) {
    items[k] = { obj, axis, max, label, target: 0, t: 0 };
    obj.traverse(o => { if (o.isMesh) { o.userData.item = k; pickables.push(o); } });
  }
  const wheels = [];
  const frontSteer = [];
  const beamMeshes = [];

  const badge = (text) => canvasTex(256, 80, (g, w, h) => {
    g.fillStyle = '#16171a'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#c9a24a'; g.font = 'italic 800 54px "Archivo", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 3);
  });

  /* Estructura central */
  box(4.3, 0.1, 1.72, trim, 0, 0.42, 0, car);                        // chasis
  box(1.93, 0.025, 1.78, carpet, 0.015, 0.52, 0, car);               // piso de la cabina
  box(1.25, 0.1, 1.72, carpet, -1.55, 0.6, 0, car);                  // piso de carga
  [-1, 1].forEach(s => box(1.2, 0.62, 0.02, carpet, -1.55, 0.97, s * 0.77, car));
  box(0.14, 0.34, 1.5, trim, 2.2, 0.98, 0, car);                     // frente negro
  box(0.05, 0.19, 0.9, paint, 2.275, 0.99, 0, car);                  // parrilla del color de la carrocería
  box(0.24, 0.42, 1.94, trim, 2.2, 0.66, 0, car);                    // parachoques delantero
  box(0.03, 0.05, 0.9, chrome, 2.325, 0.5, 0, car);                  // protector
  box(0.04, 0.03, 1.2, chrome, 2.32, 0.84, 0, car);                  // moldura
  box(0.24, 0.4, 1.94, trim, -2.22, 0.66, 0, car);                   // parachoques trasero
  box(0.03, 0.05, 0.8, chrome, -2.345, 0.5, 0, car);
  const plateF = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.145), new THREE.MeshBasicMaterial({ map: badge('V27') }));
  plateF.position.set(2.323, 0.66, 0); plateF.rotation.y = PI / 2; car.add(plateF);
  const plateR = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.145), new THREE.MeshBasicMaterial({ map: badge('V27') }));
  plateR.position.set(-2.343, 0.66, 0); plateR.rotation.y = -PI / 2; car.add(plateR);
  cyl(0.03, 0.2, gun, -2.4, 0.56, 0.45, car, 14).rotation.z = PI / 2;   // gancho de remolque

  /* Compartimento del motor */
  box(1.3, 0.1, 1.3, trim, 1.6, 0.5, 0, car);
  box(0.06, 0.7, 1.5, plastic, 1.02, 0.85, 0, car);
  box(0.6, 0.3, 0.6, gun, 1.5, 0.75, 0, car);
  box(0.5, 0.06, 0.5, plastic, 1.5, 0.93, 0, car);
  for (let i = 0; i < 3; i++) box(0.05, 0.05, 0.44, chrome, 1.65 - i * 0.12, 0.97, 0, car);
  box(0.06, 0.4, 1.0, plastic, 2.14, 0.85, 0, car);
  box(0.22, 0.2, 0.16, plastic, 1.2, 0.72, 0.52, car);
  box(0.22, 0.2, 0.16, plastic, 1.2, 0.72, -0.52, car);

  /* Capó */
  const hoodPivot = new THREE.Group();
  hoodPivot.position.set(0.98, 1.15, 0);
  hoodPivot.add(extrude(poly([[0, 0], [1.27, -0.08], [1.27, -0.2], [0, -0.09]]), 1.5, paint, 0.008));
  car.add(hoodPivot);
  addItem('hood', hoodPivot, 'z', 1.0, 'Capó');

  /* Portón trasero con llanta de repuesto (bisagra lateral) */
  (function () {
    const hx = -2.17, hz = 0.86;
    const hinge = new THREE.Group(); hinge.position.set(hx, 0, hz);
    const inner = new THREE.Group(); inner.position.set(-hx, 0, -hz); hinge.add(inner);
    box(0.08, 0.31, 1.62, paint, -2.19, 1.015, 0, inner);                 // panel inferior
    const lun = box(0.03, 0.62, 1.46, glass, -2.19, 1.5, 0, inner); lun.castShadow = false;
    box(0.08, 0.1, 1.62, paint, -2.19, 1.86, 0, inner);                   // marco superior
    [-1, 1].forEach(s => box(0.08, 0.62, 0.08, paint, -2.19, 1.5, s * 0.77, inner));
    box(0.02, 0.9, 1.5, carpet, -2.14, 1.35, 0, inner);                   // interior
    const tire = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.31, 0.1, 18, 44), rubber));
    tire.rotation.y = PI / 2; tire.scale.z = 1.4; tire.position.set(-2.4, 1.2, 0); inner.add(tire);
    cyl(0.3, 0.05, paint, -2.545, 1.2, 0, inner, 40).rotation.z = PI / 2;      // cubierta
    cyl(0.2, 0.012, trim, -2.575, 1.2, 0, inner, 32).rotation.z = PI / 2;
    box(0.02, 0.04, 0.3, trim, -2.58, 1.37, 0, inner);
    box(0.06, 0.34, 0.05, trim, -2.27, 1.0, -0.74, inner);                // manija
    car.add(hinge);
    addItem('tail', hinge, 'y', 1.75, 'Portón');
  })();

  /* Techo, parabrisas y rieles */
  box(2.82, 0.05, 1.92, paint, -0.8, 1.885, 0, car);
  box(2.6, 0.012, 1.7, liner, -0.8, 1.855, 0, car);
  [[-0.1, 0.9], [-1.2, 0.95]].forEach(([x, l]) => box(l, 0.012, 1.15, glassDark, x, 1.915, 0, car));
  box(0.12, 0.1, 1.7, trim, -2.17, 1.94, 0, car);                         // alerón
  [-1, 1].forEach(s => {
    box(2.5, 0.035, 0.045, chrome, -0.85, 1.99, s * 0.8, car);
    [-0.2, -1.1, -1.95].forEach(x => box(0.05, 0.09, 0.05, trim, x, 1.94, s * 0.8, car));
  });
  const ws = box(0.806, 0.014, 1.62, glass, 0.77, 1.51, 0, car); ws.rotation.z = Math.atan2(0.7, -0.4); ws.castShadow = false;
  [-0.45, 0.35].forEach(z => { const wp = box(0.5, 0.012, 0.012, trim, 1.01, 1.2, z, car); wp.rotation.y = 0; });

  /* Ruedas */
  function wheelAssembly() {
    const g = new THREE.Group();
    const spin = new THREE.Group(); g.add(spin);
    const tire = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.295, 0.095, 20, 52), rubber)); tire.scale.z = 1.5; spin.add(tire);
    const barrel = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.215, 0.2, 40, 1, true), plastic)); barrel.rotation.x = PI / 2; spin.add(barrel);
    const face = new THREE.Mesh(new THREE.CircleGeometry(0.215, 40), plastic); face.position.z = 0.09; spin.add(face);
    for (let i = 0; i < 5; i++) {
      const arm = new THREE.Group(); arm.rotation.z = i * (2 * PI / 5) + 0.3;
      box(0.17, 0.1, 0.012, chrome, 0.12, 0, 0.098, arm); spin.add(arm);
    }
    cyl(0.06, 0.03, gun, 0, 0, 0.1, spin, 20).rotation.x = PI / 2;
    cyl(0.17, 0.014, gun, 0, 0, -0.03, spin, 36).rotation.x = PI / 2;
    box(0.15, 0.08, 0.05, gun, 0, 0.14, 0.01, g);
    wheels.push(spin);
    return g;
  }

  function buildSide(s) {
    const g = new THREE.Group(); g.scale.z = s; car.add(g);

    /* Guardabarros delantero */
    const fs = new THREE.Shape();
    fs.moveTo(0.9, 0.39); fs.lineTo(0.9, 1.15); fs.lineTo(2.2, 1.08); fs.lineTo(2.26, 0.95); fs.lineTo(2.26, 0.39); fs.lineTo(1.88, 0.39);
    fs.absarc(1.4, 0.39, 0.48, 0, PI, false); fs.closePath();
    const fender = extrude(fs, 0.2, paint, 0.006); fender.position.z = 0.875; g.add(fender);

    /* Costado trasero */
    const qs = new THREE.Shape();
    qs.moveTo(-0.9, 0.39); qs.lineTo(-0.9, 1.12); qs.lineTo(-2.17, 1.12); qs.lineTo(-2.2, 0.95); qs.lineTo(-2.2, 0.39); qs.lineTo(-1.88, 0.39);
    qs.absarc(-1.4, 0.39, 0.48, PI, 0, true); qs.closePath();
    const quarter = extrude(qs, 0.2, paint, 0.006); quarter.position.z = 0.875; g.add(quarter);

    /* Pasos de rueda negros */
    [1.4, -1.4].forEach(cx => {
      const fl = new THREE.Shape();
      fl.absarc(cx, 0.39, 0.57, 0, PI, false); fl.absarc(cx, 0.39, 0.47, PI, 0, true); fl.closePath();
      const m = extrude(fl, 0.07, trim, 0); m.position.z = 0.99; g.add(m);
    });

    /* Pilares y rieles */

    uiRefs.opts.auto.setAttribute('aria-pressed', controls.autoRotate);
    ['ghost', 'lights', 'roll'].forEach(k => uiRefs.opts[k].setAttribute('aria-pressed', opts[k]));
    $('status').innerHTML = 'Puertas <b>' + open + '/' + doors + '</b><br>Capó <b>' + (items.hood.target ? 'abierto' : 'cerrado') + '</b> · Portón <b>' + (items.tail.target ? 'abierto' : 'cerrado') + '</b><br>Vista <b>' + viewNames[mode === 'orbit' ? 'orbit' : seatKey] + '</b>';
  }

  function setDockMin(min) {
    $('dock').classList.toggle('min', min);
    $('minBtn').textContent = min ? 'Mostrar' : 'Ocultar'; $('minBtn').setAttribute('aria-expanded', String(!min));
    requestAnimationFrame(resize);
  }
  $('minBtn').addEventListener('click', () => setDockMin(!$('dock').classList.contains('min')));

  applyOpts(); refreshUI(); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  frame();

})();
</script>
</body>
</html>
