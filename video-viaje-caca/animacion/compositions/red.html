  <script>
    
const P = {
  mood(tl, id, mood, t) {
    const all = ["smile", "o", "frown"];
    tl.to(`#${id}-b`, { scaleY: 0.86, scaleX: 1.08, duration: 0.07, svgOrigin: "150 262", ease: "power2.in" }, t);
    all.forEach((m) => tl.set(`#${id}-m-${m}`, { opacity: m === mood ? 1 : 0 }, t + 0.07));
    tl.set(`#${id}-brows`, { opacity: mood === "smile" ? 0 : 1 }, t + 0.07);
    tl.to(`#${id}-b`, { scaleY: 1, scaleX: 1, duration: 0.35, svgOrigin: "150 262", ease: "elastic.out(1,0.45)" }, t + 0.07);
  },
  blink(tl, id, t) {
    tl.to(`#${id}-eyes`, { scaleY: 0.08, duration: 0.05, svgOrigin: "150 164" }, t);
    tl.to(`#${id}-eyes`, { scaleY: 1, duration: 0.08, svgOrigin: "150 164" }, t + 0.09);
  },
  look(tl, id, dx, dy, t) {
    tl.to(`#${id}-pup`, { x: dx, y: dy, duration: 0.15, ease: "power3.out" }, t);
  },
  idle(tl, id, t0, t1) {
    const n = Math.max(1, Math.floor((t1 - t0) / 1.1));
    tl.to(`#${id}-b`, { scaleY: 1.035, scaleX: 0.98, duration: 0.55, svgOrigin: "150 262", ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, t0);
  },
  wave(tl, id, t, times) {
    tl.to(`#${id}-ar`, { rotation: -35, duration: 0.14, svgOrigin: "260 222", ease: "sine.inOut", yoyo: true, repeat: times * 2 - 1 }, t);
  },
  sweat(tl, id, t) {
    tl.fromTo(`#${id}-sweat`, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.2 }, t);
    tl.to(`#${id}-sweat`, { y: 40, opacity: 0, duration: 0.7, ease: "power2.in" }, t + 0.6);
  },
};

    const tl = gsap.timeline({ paused: true });
    gsap.set(["#r-b", "#r-c"], { opacity: 0 });
    // --- A (0 – 4.78): baja por la tubería en pendiente
    const A = { x: 300, y: 700 }, B = { x: 1180, y: 1170 };
    const sp = { p: 0 };
    const placeA = () => {
      const x = A.x + (B.x - A.x) * sp.p, y = A.y + (B.y - A.y) * sp.p;
      gsap.set("#r-pa", { x: x - 110, y: y - 170 });
      gsap.set("#r-speed", { attr: { transform: `translate(${x - 90},${y - 70})` } });
    };
    tl.fromTo("#r-pa", { rotation: 28 }, { rotation: 28, duration: 0.01 }, 0);
    tl.fromTo(sp, { p: -0.02 }, { p: 1, duration: 4.4, ease: "power2.in", onUpdate: placeA, onStart: placeA }, 0.2);
    tl.fromTo("#r-speed", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.6);
    P.mood(tl, "ra", "smile", 0.4);
    P.blink(tl, "ra", 1.4);
    P.look(tl, "ra", 6, 4, 2.0);
    tl.fromTo("#r-grav", { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, 3.55);
    tl.to("#r-grav", { opacity: 0, duration: 0.15 }, 4.6);
    // --- B (4.78 – 8.52): el barrio
    tl.to("#r-b", { opacity: 1, duration: 0.01 }, 4.78);
    tl.to("#r-a", { opacity: 0, duration: 0.01 }, 4.8);
    tl.fromTo("#r-map", { scale: 1.9, filter: "blur(12px)" }, { scale: 1.9, filter: "blur(0px)", duration: 0.15, transformOrigin: "180px 320px" }, 4.78);
    document.querySelectorAll("#root .r-house").forEach((h, i) => {
      tl.fromTo(h, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.6)", transformOrigin: "50% 100%" }, 4.85 + i * 0.12);
    });
    document.querySelectorAll("#root .r-pipe").forEach((p, i) => {
      const len = p.getTotalLength();
      tl.fromTo(p, { attr: { "stroke-dasharray": `${len} ${len}`, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, 5.0 + i * 0.1);
    });
    tl.to("#r-flow", { opacity: 1, duration: 0.2 }, 5.9);
    tl.fromTo("#r-flow path", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -440 }, duration: 3.0, ease: "none" }, 5.5);
    tl.to("#r-map", { scale: 1, duration: 1.6, ease: "power2.inOut", transformOrigin: "180px 320px" }, 6.4);
    tl.fromTo("#r-barrio", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 7.6);
    // --- C (8.52 – 12.07): el colector
    tl.to("#r-c", { opacity: 1, duration: 0.01 }, 8.52);
    tl.to("#r-b", { opacity: 0, duration: 0.01 }, 8.54);
    tl.fromTo("#r-ccam", { scale: 2.6 }, { scale: 2.6, duration: 0.01, transformOrigin: "630px 930px" }, 8.52);
    tl.to("#r-ccam", { scale: 1, duration: 1.7, ease: "power3.inOut", transformOrigin: "630px 930px" }, 8.9);
    tl.fromTo("#r-pc", { y: 0, rotation: -6 }, { y: 10, rotation: 6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 5 }, 8.52);
    tl.fromTo("#r-ripple", { x: 0 }, { x: -160, duration: 3.5, ease: "none" }, 8.52);
    P.mood(tl, "rc", "o", 9.4);
    P.look(tl, "rc", -10, -6, 9.6);
    tl.to("#r-warm", { rotation: -30, svgOrigin: "290 780", duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, 10.4);
    tl.fromTo("#r-col", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 10.4);
    // salida: oscurece
    tl.to("#r-c", { filter: "brightness(0.25)", duration: 0.25, ease: "power2.in" }, 11.8);
    // cámara: golpes y sacudidas (generado)
    tl.fromTo("#red-cam", { scale: 1.075 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 4.778);
    tl.fromTo("#red-cam", { scale: 1.075 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 8.516);
    window.__timelines["red"] = tl;
  </script>
