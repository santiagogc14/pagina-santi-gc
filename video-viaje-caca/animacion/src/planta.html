    const tl = gsap.timeline({ paused: true });

    items.forEach(([id, y, t]) => {
      tl.fromTo(id, { x: -150, y: y, rotation: 0 }, { x: 480, rotation: 20, duration: 0.4, ease: "power1.in" }, t);
      tl.to(id, { x: 300, y: y - 110, rotation: -200, duration: 0.5, ease: "power2.out" }, t + 0.4);
      tl.to(id, { y: y + 900, duration: 0.6, ease: "power2.in" }, t + 0.9);
    });
    tl.fromTo("#pl-pb", { x: -300 }, { x: 320, duration: 0.6, ease: "power2.inOut" }, 5.0);
    tl.to("#pl-pb", { scaleX: 0.35, duration: 0.12, transformOrigin: "50% 50%" }, 5.55);
    tl.to("#pl-pb", { x: 900, duration: 0.4, ease: "power2.in" }, 5.6);
    tl.to("#pl-pb", { scaleX: 1, duration: 0.3, ease: "elastic.out(1,0.4)", transformOrigin: "50% 50%" }, 5.75);

    tl.to("#pl-b", { opacity: 0, duration: 0.01 }, 6.75);
    tl.fromTo("#pl-c", { y: 1920 }, { y: 0, duration: 0.35, ease: "expo.out" }, 6.38);
    gsap.set("#pl-bugs", { opacity: 0 });
    tl.fromTo("#pl-tc", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 6.7);
    P.mood(tl, "pc", "smile", 6.6);

    tl.fromTo("#pl-parts", { y: 0 }, { y: 420, duration: 3.2, ease: "power1.in" }, 6.7);
    tl.fromTo("#pl-murk", { opacity: 0.85 }, { opacity: 0, duration: 3.2, ease: "power1.inOut" }, 6.8);
    // bacterias
    tl.to("#pl-tc", { opacity: 0, duration: 0.15 }, 10.1);
    tl.fromTo("#pl-tc2", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 10.25);
    tl.to("#pl-bugs", { opacity: 1, duration: 0.01 }, 10.2);
    document.querySelectorAll("#root .pl-bug").forEach((b, i) => {
      tl.fromTo(b, { x: (i % 2 ? 600 : -600), y: 80 }, { x: 0, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 10.25 + i * 0.12);
    });
    document.querySelectorAll("#root .pl-jaw").forEach((j, i) => {
      tl.fromTo(j, { scaleY: 1 }, { scaleY: 0.1, duration: 0.12, yoyo: true, repeat: 15, transformOrigin: "50% 0%" }, 10.9 + i * 0.05);
    });
    tl.to("#pl-ccam", { scale: 1.3, duration: 3.6, ease: "power1.inOut", transformOrigin: "540px 1000px" }, 10.4);
    tl.to("#pl-sludge", { y: 90, duration: 3.4, ease: "power1.in" }, 11.0);

    P.sweat(tl, "pc", 11.3);
    tl.to("#pl-pc", { y: 640, scale: 0.6, opacity: 0, duration: 1.0, ease: "power2.in" }, 13.4);

    tl.to("#pl-c", { opacity: 0, duration: 0.01 }, 14.72);
    tl.fromTo("#pl-d", { scale: 1.15, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 14.7);

    tl.fromTo("#pl-k2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 15.6);
    tl.fromTo("#pl-k3", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 16.6);
    tl.fromTo("#pl-rwave", { x: 0 }, { x: 120, duration: 3.9, ease: "none" }, 14.74);
    tl.fromTo("#pl-pd", { y: 0, rotation: -5 }, { y: 14, rotation: 5, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 5 }, 14.74);
