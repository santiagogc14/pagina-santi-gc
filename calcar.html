<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>Calcar</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    position: fixed; inset: 0;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #pick {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  #pick label {
    background: #fff; color: #000; font: 600 20px -apple-system, sans-serif;
    padding: 18px 28px; border-radius: 14px;
  }
  #pick input { display: none; }
  #img {
    display: none; position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    object-fit: contain; background: #000;
    pointer-events: none;
    -webkit-user-drag: none;
    transform-origin: center center;
  }
  body.ready #pick { display: none; }
  body.ready #img { display: block; }

  #panel {
    display: none; position: fixed; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(20,20,20,.85); color: #fff;
    border-radius: 16px; padding: 14px 16px;
    font: 15px -apple-system, sans-serif;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  body.editing #panel { display: block; }
  #panel label { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  #panel span { width: 80px; flex: none; }
  #panel input[type=range] { flex: 1; touch-action: pan-x; }
  #panel small { display: block; text-align: center; opacity: .6; margin-top: 6px; }
</style>
</head>
<body>
  <div id="pick">
    <label>Añadir imagen<input id="file" type="file" accept="image/*"></label>
  </div>
  <img id="img" alt="">

  <div id="panel">
    <label><span>Zoom</span><input id="zoom" type="range" min="1" max="5" step="0.01" value="1"></label>
    <label><span>Brillo</span><input id="bright" type="range" min="0.5" max="2" step="0.01" value="1"></label>
    <label><span>Contraste</span><input id="contrast" type="range" min="0.5" max="3" step="0.01" value="1"></label>
    <small>Doble toque en la imagen para fijar</small>
  </div>

<script>
  const file = document.getElementById('file');
  const img = document.getElementById('img');
  const panel = document.getElementById('panel');
  const zoom = document.getElementById('zoom');
  const bright = document.getElementById('bright');
  const contrast = document.getElementById('contrast');

  function apply() {
    img.style.transform = 'scale(' + zoom.value + ')';
    img.style.filter = 'brightness(' + bright.value + ') contrast(' + contrast.value + ')';
  }
  [zoom, bright, contrast].forEach(el => el.addEventListener('input', apply));

  file.addEventListener('change', () => {
    const f = file.files[0];
    if (!f) return;
    img.src = URL.createObjectURL(f);
    document.body.classList.add('ready');
    keepAwake();
  });

  // Doble toque en la imagen: abre/cierra la barra de ajustes
  let lastTap = 0;
  document.addEventListener('touchend', ev => {
    if (!document.body.classList.contains('ready')) return;
    if (panel.contains(ev.target)) return;
    const now = Date.now();
    if (now - lastTap < 350) {
      document.body.classList.toggle('editing');
      lastTap = 0;
    } else {
      lastTap = now;
    }
  });

  // Bloquear zoom del navegador, gestos y desplazamiento
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(e =>
    document.addEventListener(e, ev => ev.preventDefault()));
  document.addEventListener('touchmove', ev => {
    if (panel.contains(ev.target) && ev.touches.length === 1) return;
    if (document.body.classList.contains('ready') || ev.touches.length > 1) ev.preventDefault();
  }, { passive: false });
  document.addEventListener('dblclick', ev => ev.preventDefault());
  document.addEventListener('contextmenu', ev => ev.preventDefault());

  // Pantalla siempre encendida
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.body.classList.contains('ready')) keepAwake();
  });
</script>
</body>
</html>
